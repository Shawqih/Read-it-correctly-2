name: Build Android APK (أقرأها صح)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 استنساخ المستودع (Checkout Code)
        uses: actions/checkout@v4

      - name: 🟢 إعداد بيئة Node.js (Setup Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 تثبيت الحزم وبناء واجهة الويب (Build Web Assets)
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: 📂 تحديث ملفات الويب في مشروع أندرويد (Sync Web Assets)
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/

      - name: ☕ إعداد بيئة Java 17 (Setup JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 إعداد أداة بناء Gradle (Setup Gradle)
        uses: gradle/actions/setup-gradle@v4

      - name: 🔨 بناء نسخة أندرويد APK (Build Android APK with Gradle)
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace

      - name: 🔍 التحقق من مسار ملف الـ APK (Locate Generated APK)
        id: locate_apk
        run: |
          echo "Finding generated APKs:"
          find android/app/build/outputs/apk/ -name "*.apk" -type f

      - name: 📤 رفع ملف الـ APK كعنصر قابل للتحميل المباشر (Upload APK Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: aqraha-sah-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 📋 ملخص التقرير والإرشادات (Job Summary)
        run: |
          echo "## 🎉 تم بناء تطبيق «أقرأها صح» أندرويد بنجاح!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **اسم التطبيق:** أقرأها صح (Aqraha Sah)" >> $GITHUB_STEP_SUMMARY
          echo "- **المعرف (App ID):** com.aqraha.sah" >> $GITHUB_STEP_SUMMARY
          echo "- **المشرف العام:** م/ شوقي حسن الجعور" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📲 كيفية تحميل وتثبيت التطبيق على هاتفك:" >> $GITHUB_STEP_SUMMARY
          echo "1. اضغط على رابط التحميل في قسم **Artifacts** بالأسفل: **aqraha-sah-android-debug-apk**." >> $GITHUB_STEP_SUMMARY
          echo "2. فك الضغط عن الملف المحمل." >> $GITHUB_STEP_SUMMARY
          echo "3. قم بنقل وتثبيت ملف \`app-debug.apk\` على هاتفك أو جهازك اللوحي بنظام أندرويد." >> $GITHUB_STEP_SUMMARY
